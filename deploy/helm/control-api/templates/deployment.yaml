apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "control-api.fullname" . }}
  labels:
    {{- include "control-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "control-api.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "control-api.labels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: {{ include "control-api.fullname" . }}-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "control-api.fullname" . }}-app
                  key: JWT_SECRET

            {{- if .Values.postgresql.enabled }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: {{ .Values.postgresql.auth.secretKeys.userPasswordKey }}
            - name: POSTGRES_URL
              value: "postgres://{{ .Values.postgresql.auth.username }}:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
            {{- else }}
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "control-api.fullname" . }}-app
                  key: POSTGRES_URL
            {{- end }}

            {{- if .Values.redis.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.auth.existingSecret }}
                  key: {{ .Values.redis.auth.existingSecretPasswordKey }}
            - name: REDIS_ADDR
              value: "{{ .Release.Name }}-redis-master:6379"
            {{- else }}
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: {{ include "control-api.fullname" . }}-app
                  key: REDIS_ADDR
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "control-api.fullname" . }}-app
                  key: REDIS_PASSWORD
            {{- end }}

          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
