apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "control-api.fullname" . }}
spec:
  entryPoints:
    - {{ .Values.ingress.entryPoint }}
  routes:
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      services:
        - name: {{ include "control-api.fullname" . }}
          port: 80
          serversTransport: {{ include "control-api.fullname" . }}-transport
